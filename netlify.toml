[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  # Netlify serves from the domain root, so no base path is needed.

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/puzzles/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
